<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Akhand Bharat Seva | అఖండ భారత్ సేవ - Your City. Your Voice. Our Responsibility.</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Akhand Bharat Seva is a responsive civic complaint management and smart priority grievance redressal platform.">
  <meta name="theme-color" content="#0d2346">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&family=Noto+Sans+Telugu:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
  <app-root></app-root>

  <!-- Quick Access Hub for Cloudflare & Admin Routes -->
  <div id="quickAccessHub" style="position:fixed; bottom:16px; left:50%; transform:translateX(-50%); z-index:999999; background:rgba(7, 19, 36, 0.95); backdrop-filter:blur(12px); border:1px solid rgba(234, 179, 8, 0.4); border-radius:100px; padding:6px 14px; box-shadow:0 10px 25px -5px rgba(0,0,0,0.5), 0 0 15px rgba(234, 179, 8, 0.2); display:flex; align-items:center; gap:10px; font-family:'Inter', sans-serif; font-size:12px; color:#f8fafc; max-width:96vw; flex-wrap:wrap; justify-content:center;">
    <div style="display:flex; align-items:center; gap:6px; font-weight:700; color:#eab308; padding-right:6px; border-right:1px solid rgba(255,255,255,0.15);">
      <span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:#22c55e; box-shadow:0 0 8px #22c55e;"></span>
      <span>LIVE</span>
    </div>
    
    <a href="https://layer-latino-release-decrease.trycloudflare.com" target="_blank" rel="noopener" style="display:inline-flex; align-items:center; gap:5px; background:linear-gradient(135deg, #f97316, #ea580c); color:#ffffff; text-decoration:none; padding:4px 12px; border-radius:50px; font-weight:600; transition:all 0.2s;" onmouseover="this.style.opacity='0.9'" onmouseout="this.style.opacity='1'">
      <i class="bi bi-cloud-check-fill"></i> Cloudflare Live URL
      <i class="bi bi-box-arrow-up-right" style="font-size:10px;"></i>
    </a>

    <a href="/admin/login" style="display:inline-flex; align-items:center; gap:5px; background:rgba(30, 58, 138, 0.7); border:1px solid rgba(96, 165, 250, 0.4); color:#93c5fd; text-decoration:none; padding:4px 12px; border-radius:50px; font-weight:600; transition:all 0.2s;" onmouseover="this.style.background='rgba(37, 99, 235, 0.8)'" onmouseout="this.style.background='rgba(30, 58, 138, 0.7)'">
      <i class="bi bi-shield-lock-fill"></i> Officer Login (/admin/login)
    </a>

    <a href="/admin/map" style="display:inline-flex; align-items:center; gap:5px; background:rgba(15, 23, 42, 0.8); border:1px solid rgba(255, 255, 255, 0.15); color:#cbd5e1; text-decoration:none; padding:4px 12px; border-radius:50px; font-weight:500; transition:all 0.2s;" onmouseover="this.style.borderColor='#eab308'" onmouseout="this.style.borderColor='rgba(255, 255, 255, 0.15)'">
      <i class="bi bi-map-fill" style="color:#eab308;"></i> Admin GIS Map (/admin/map)
    </a>

    <button onclick="document.getElementById('quickAccessHub').style.display='none'" title="Dismiss" style="background:none; border:none; color:#94a3b8; cursor:pointer; font-size:14px; padding:2px 6px; line-height:1;" onmouseover="this.style.color='#ffffff'" onmouseout="this.style.color='#94a3b8'">
      ✕
    </button>
  </div>
</body>
</html>
